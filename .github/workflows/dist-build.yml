name: Dist Build

# deepseek-harness master 预构建流水线(双 job:构建 → 发布)
# 运行在本控制仓(dsh-mirror-sync):clone 上游 → 构建 + 打包 npm tarballs
# → 上游无更新时自动跳过 → 产物经 artifact 桥接到 publish job 发布:
#   · 制品以普通文件形式提交到两端 dsh-dist 仓库的 pkgs/ 目录(主分发渠道,
#     消费端 git clone --depth 1 即得全套,不受 Gitee 单 Release 附件 200 上限影响)
#   · 同时建 Release 作版本标记(GitHub 端附全部 tgz 直链;Gitee 端仅标记页)
#
# 发布阶段失败时,在 Actions 运行页点 "Re-run failed jobs" 只重跑发布(约 1 分钟)

on:
  workflow_run:
    workflows: ['Mirror Sync']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: dist-build
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  GITHUB_DIST_REPO: 'Fuxi-zy/dsh-dist'
  ARTIFACT_NAME: dsh-npm-tarballs

jobs:
  build:
    # Mirror Sync 成功时或手动触发时才构建
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      upstream_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: 克隆上游并去重
        id: meta
        run: |
          set -euo pipefail
          git clone https://github.com/deepseek-ai/deepseek-harness.git "$GITHUB_WORKSPACE/repo"
          cd "$GITHUB_WORKSPACE/repo"
          UPSTREAM_SHA=$(git rev-parse HEAD)
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "上游 master: $UPSTREAM_SHA"
          LAST=$(curl -fsSL -m 30 "https://api.github.com/repos/${GITHUB_DIST_REPO}/contents/latest.json" 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(Buffer.from(JSON.parse(d).content,'base64').toString('utf8')).upstream_sha||'')}catch(e){console.log('')}})" || true)
          echo "上次构建: ${LAST:-无}"
          if [ -n "$LAST" ] && [ "$UPSTREAM_SHA" = "$LAST" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 上游无更新,跳过构建
        if: steps.meta.outputs.skip == '1'
        run: echo "自上次构建以来上游无新提交,本次跳过。"

      - name: 安装 pnpm
        if: steps.meta.outputs.skip != '1'
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0 # 与上游 package.json 的 packageManager 一致(本仓库无 package.json,须显式指定)
          dest: ${{ runner.temp }}/setup-pnpm

      - name: 安装 Node
        if: steps.meta.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm store 缓存
        if: steps.meta.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: dist-node24-pnpm-${{ hashFiles('repo/pnpm-lock.yaml') }}
          restore-keys: dist-node24-pnpm-

      - name: 安装依赖
        if: steps.meta.outputs.skip != '1'
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: 构建(official 配置,流程照抄上游 Release (dsh) workflow)
        if: steps.meta.outputs.skip != '1'
        working-directory: repo
        run: pnpm run build:official

      - name: 打包 dsh 家族 tarballs
        if: steps.meta.outputs.skip != '1'
        working-directory: repo
        run: pnpm run release:pack --family dsh --out dist/npm

      - name: 打包 vendor 家族 tarballs(peer 依赖,运行需要)
        if: steps.meta.outputs.skip != '1'
        working-directory: repo
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      - name: 验证 tarball 可安装运行(上游官方验证步骤)
        if: steps.meta.outputs.skip != '1'
        working-directory: repo
        run: |
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"
          pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - name: 上传构建产物(供 publish job 使用)
        if: steps.meta.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: repo/dist/npm*/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      UPSTREAM_SHA: ${{ needs.build.outputs.upstream_sha }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: 发布到两端 dsh-dist
        run: |
          set -euo pipefail
          SHORT=${UPSTREAM_SHA:0:9}
          DATE=$(date -u +%Y%m%d-%H%M)
          TAG="master-${SHORT}-${DATE}"
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GITEE_URL="https://gitee.com/zhang-jixiangZJX/dsh-dist/releases/${TAG}"
          GITHUB_URL="https://github.com/${GITHUB_DIST_REPO}/releases/tag/${TAG}"
          export GH_TOKEN="${GH_PAT}"
          echo "发布 Release: $TAG"

          # ── ⓪ 清理同上游 SHA 的历史残留(此前失败遗留的半成品 Release 与 tag)──
          curl -fsSL -m 60 "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/releases?access_token=${GITEE_TOKEN}&per_page=100" 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{for(const r of JSON.parse(d))if(r.tag_name&&r.tag_name.startsWith('master-${SHORT}-'))console.log(r.id+' '+r.tag_name)}catch(e){}})" \
          | while read -r rid rtag; do
              echo "清理 Gitee 残留: $rtag (ID $rid)"
              curl -fsS -m 60 -X DELETE "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/releases/${rid}?access_token=${GITEE_TOKEN}" || true
              curl -fsS -m 60 -X DELETE "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/tags/${rtag}?access_token=${GITEE_TOKEN}" || true
            done
          gh release list -R "${GITHUB_DIST_REPO}" --json tagName \
            --jq ".[] | select(.tagName|startswith(\"master-${SHORT}-\")) | .tagName" 2>/dev/null \
          | while read -r rtag; do
              echo "清理 GitHub 残留: $rtag"
              gh release delete "$rtag" -R "${GITHUB_DIST_REPO}" --yes --cleanup-tag || true
            done

          # ── ① 两端仓库准备:克隆;空仓库自动初始化;统一工作分支为 master ──
          prepare_dist() { # $1=目录 $2=带凭证远端 URL
            rm -rf "$1"
            if ! git clone -q "$2" "$1" 2>/dev/null || [ -z "$(git -C "$1" ls-remote --heads origin 2>/dev/null | head -1)" ]; then
              rm -rf "$1"
              mkdir -p "$1" && cd "$1"
              git init -q -b master
              echo "# dsh-dist" > README.md
              git add README.md
              git -c user.name="dist-bot" -c user.email="dist-bot@users.noreply.github.com" commit -qm "chore: init"
              git remote add origin "$2"
              git push -q origin master
              cd - >/dev/null
            else
              git -C "$1" checkout -q -B master
              git -C "$1" push -q origin master
            fi
          }
          prepare_dist /tmp/dist-gitee "https://zhang-jixiangZJX:${GITEE_TOKEN}@gitee.com/zhang-jixiangZJX/dsh-dist.git"
          prepare_dist /tmp/dist-gh "https://x-access-token:${GH_PAT}@github.com/${GITHUB_DIST_REPO}.git"

          # ── ② 制品入库:全部 tgz 提交到两端仓库 pkgs/(主分发渠道,克隆即得全套)──
          load_pkgs() { # $1=仓库目录
            rm -rf "$1/pkgs"
            mkdir -p "$1/pkgs"
            cp dist/npm/*.tgz "$1/pkgs/"
            cp dist/npm-vendor/*.tgz "$1/pkgs/"
            [ -d dist/npm-landlock ] && cp dist/npm-landlock/*.tgz "$1/pkgs/" || true
            echo "pkgs/ 共 $(ls "$1"/pkgs | wc -l) 个包,计 $(du -sh "$1/pkgs" | cut -f1)"
            cd "$1"
            git config user.name "dist-bot"
            git config user.email "dist-bot@users.noreply.github.com"
            git add -A pkgs
            git commit -qm "chore: pkgs -> ${SHORT} (${TAG})"
            git push -q origin master
            cd - >/dev/null
          }
          load_pkgs /tmp/dist-gitee
          load_pkgs /tmp/dist-gh

          # ── ③ Gitee Release:仅作版本标记页(附件受单 Release 200 上限,不再承载货物)──
          curl -fsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -X POST "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/releases" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"deepseek-harness master 预构建 | 上游提交 ${UPSTREAM_SHA} | ${DATE} UTC | 制品请直接克隆本仓库 master 分支的 pkgs/ 目录\",\"target_commitish\":\"master\"}" >/dev/null
          echo "Gitee 标记 Release 已创建"

          # ── ④ GitHub Release:附带全部 tgz 直链(无上限,便于单个取用)──
          FILES=(dist/npm/*.tgz dist/npm-vendor/*.tgz)
          [ -d dist/npm-landlock ] && FILES+=(dist/npm-landlock/*.tgz)
          gh release create "$TAG" "${FILES[@]}" \
            -R "${GITHUB_DIST_REPO}" \
            --title "$TAG" \
            --notes "deepseek-harness master 预构建 | 上游提交 ${UPSTREAM_SHA} | ${BUILT_AT} | 整套获取建议直接克隆仓库 pkgs/ 目录 | Gitee 镜像: ${GITEE_URL}" \
            --target master

          # ── ⑤ 双端更新 latest.json(发布全部成功后才移动指针)────
          write_latest() { # $1=目录
            cd "$1"
            cat > latest.json <<EOF
          {
            "upstream_sha": "${UPSTREAM_SHA}",
            "tag": "${TAG}",
            "gitee_release": "${GITEE_URL}",
            "github_release": "${GITHUB_URL}",
            "built_at": "${BUILT_AT}"
          }
          EOF
            git config user.name "dist-bot"
            git config user.email "dist-bot@users.noreply.github.com"
            git add latest.json
            git commit -qm "chore: latest -> ${SHORT}"
            git push -q origin master
            cd - >/dev/null
          }
          write_latest /tmp/dist-gitee
          write_latest /tmp/dist-gh

          echo "完成: $TAG"
          echo "  国内: $GITEE_URL"
          echo "  海外: $GITHUB_URL"
