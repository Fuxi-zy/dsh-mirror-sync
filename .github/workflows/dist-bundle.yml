name: Dist Bundle

# dsh 官方 npm 发布版 → 开箱即用 bundle(Windows)
# 流程:查询 npmjs 上 @deepseek-ai/dsh 最新版 → 与上次 bundle 版本比对(去重)
#      → Windows runner 上 pnpm(hoisted+allowBuilds)安装 + 冒烟
#      → 整目录打 tar.xz(实测 78MB→11MB,跨境上传友好)→ 发布双端 dsh-dist Release + 更新 latest.json
# 应用端:下载 tar.xz → sha256 校验 → 系统 tar.exe 解压即用(首次约 1~2 分钟,替代 19 分钟在线安装)

on:
  schedule:
    - cron: '41 */8 * * *' # UTC,每 8 小时检查 npm 新版(官方发版节奏不频繁,足够及时)
  workflow_dispatch:

concurrency:
  group: dist-bundle
  cancel-in-progress: false

env:
  GITHUB_DIST_REPO: 'Fuxi-zy/dsh-dist'
  DSH_PKG: '@deepseek-ai/dsh'
  # runner 在海外,官方源最快(实测 npmmirror 从美西访问极慢,一次 view 要 11s);
  # bundle 内容与源无关(包内容寻址一致),npmmirror 只用于国内应用端
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  bundle:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: 查询最新版本并去重
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(npm view $DSH_PKG version --registry=$NPM_REGISTRY)
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "npm 最新版: $LATEST"
          LAST=$(curl -fsSL -m 30 "https://api.github.com/repos/${GITHUB_DIST_REPO}/contents/latest.json" 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(Buffer.from(JSON.parse(d).content,'base64').toString('utf8')).version||'')}catch(e){console.log('')}})" || true)
          echo "上次 bundle: ${LAST:-无}"
          if [ -n "$LAST" ] && [ "$LATEST" = "$LAST" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 无新版本,跳过
        if: steps.meta.outputs.skip == '1'
        shell: bash
        run: echo "npm 上无新版本,本次跳过。"

      - name: 安装(pnpm hoisted,Windows 上比 npm 快数倍)
        if: steps.meta.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          printf '{"name":"dsh-runtime","private":true}' > runtime/package.json
          # pnpm 11:设置与构建放行都走 pnpm-workspace.yaml(.npmrc 的 node-linker 已不生效)
          # - nodeLinker: hoisted → 平铺 node_modules,与 npm 同构(zip/运行兼容)
          # - allowBuilds → 放行原生模块构建脚本(pnpm 11 默认拦截,ERR_PNPM_IGNORED_BUILDS;
          #   清单与项目 fxe-marketplace/src/host/install.ts 的白名单保持一致)
          cat > runtime/pnpm-workspace.yaml <<'YAML'
          packages:
            - '.'
          nodeLinker: hoisted
          allowBuilds:
            '@deepseek-ai/dsh-subprocess-local': true
            '@google/genai': true
            'koffi': true
            'node-pty': true
            'cpu-features': true
            'ssh2': true
            'protobufjs': true
            'esbuild': true
            'unrs-resolver': true
            'sharp': true
            '@tailwindcss/oxide': true
            '@parcel/watcher': true
          YAML
          command -v pnpm >/dev/null 2>&1 || npm i -g pnpm
          cd runtime
          # 心跳:安装静默期防"像卡死"
          ( while sleep 60; do echo "[pnpm] 仍在安装中…(下载/原生模块编译静默期)"; done ) &
          HEARTBEAT=$!
          trap 'kill $HEARTBEAT 2>/dev/null || true' EXIT
          pnpm add $DSH_PKG --registry=$NPM_REGISTRY
          kill $HEARTBEAT 2>/dev/null || true
          # 完整性校验:bin shim 与包本体必须就位
          test -f node_modules/.bin/dsh.cmd
          INSTALLED=$(node -p "require('./node_modules/@deepseek-ai/dsh/package.json').version")
          echo "已安装: $INSTALLED"
          test "$INSTALLED" = "${{ steps.meta.outputs.version }}"

      - name: 冒烟(bin 可执行)
        if: steps.meta.outputs.skip != '1'
        shell: cmd
        run: |
          cd runtime
          node_modules\.bin\dsh.cmd --help || echo warn: dsh --help 非零退出(不阻断,完整性已由文件校验保证)

      - name: 打包 tar.xz + sha256
        if: steps.meta.outputs.skip != '1'
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.meta.outputs.version }}"
          archive="dsh-win-x64-${v}.tar.xz"
          # tar.xz(LZMA2):比 zip 小一半以上(实测 78MB→11MB),跨境上传快数倍;
          # 用 git-bash 的 GNU tar+xz:runner 系统 tar.exe(libarchive)未编译 xz 支持;
          # 应用端解压仍用系统 tar.exe(Windows 10/11 原生支持 xz,零依赖)。
          # -C runtime .:包内容平铺在归档顶层(package.json、node_modules)
          tar -cJf "$archive" -C runtime .
          size=$(stat -c%s "$archive")
          sha=$(sha256sum "$archive" | awk '{print $1}')
          echo "tar.xz: $archive ($((size / 1024 / 1024)) MB)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: 发布到两端 dsh-dist
        if: steps.meta.outputs.skip != '1'
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
          SIZE: ${{ steps.pack.outputs.size }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="bundle-v${VERSION}-win-x64"
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GITEE_URL="https://gitee.com/zhang-jixiangZJX/dsh-dist/releases/${TAG}"
          GITHUB_URL="https://github.com/${GITHUB_DIST_REPO}/releases/tag/${TAG}"
          export GH_TOKEN="${GH_PAT}"
          echo "发布: $TAG"

          # ⓪ 清理同 TAG 残留(上次失败留下的半成品 Release 与 tag,否则本次创建会撞)
          curl -fsSL -m 60 "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/releases?access_token=${GITEE_TOKEN}&per_page=100" 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{for(const r of JSON.parse(d))if(r.tag_name===process.argv[1])console.log(r.id)}catch(e){}})" "$TAG" \
          | while read -r rid; do
              echo "清理 Gitee 残留 Release: $rid"
              curl -fsS -m 60 -X DELETE "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/releases/${rid}?access_token=${GITEE_TOKEN}" || true
            done
          curl -fsS -m 60 -X DELETE "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/tags/${TAG}?access_token=${GITEE_TOKEN}" || true
          gh release delete "$TAG" -R "${GITHUB_DIST_REPO}" --yes --cleanup-tag 2>/dev/null || true

          # 空仓库兜底 + 统一 master 分支
          prepare_dist() { # $1=目录 $2=带凭证远端 URL
            rm -rf "$1"
            if ! git clone -q "$2" "$1" 2>/dev/null || [ -z "$(git -C "$1" ls-remote --heads origin 2>/dev/null | head -1)" ]; then
              rm -rf "$1"
              mkdir -p "$1" && cd "$1"
              git init -q -b master
              echo "# dsh-dist" > README.md
              git add README.md
              git -c user.name="dist-bot" -c user.email="dist-bot@users.noreply.github.com" commit -qm "chore: init"
              git remote add origin "$2"
              git push -q origin master
              cd - >/dev/null
            else
              git -C "$1" checkout -q -B master
              git -C "$1" push -q origin master
            fi
          }
          prepare_dist /tmp/dist-gitee "https://zhang-jixiangZJX:${GITEE_TOKEN}@gitee.com/zhang-jixiangZJX/dsh-dist.git"
          prepare_dist /tmp/dist-gh "https://x-access-token:${GH_PAT}@github.com/${GITHUB_DIST_REPO}.git"

          # ① GitHub Release 先发(与 runner 同机房,秒级完成,快速保底)
          gh release create "$TAG" "$ARCHIVE" \
            -R "${GITHUB_DIST_REPO}" \
            --title "$TAG" \
            --notes "dsh ${VERSION} Windows 开箱即用包(tar.xz,系统 tar 解压) | sha256 ${SHA256} | ${BUILT_AT} | Gitee: ${GITEE_URL}" \
            --target master

          # ② Gitee Release + 附件(跨境链路,放最后;附件字段名是 file 单数;失败重试一次)
          RELEASE_JSON=$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -X POST "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/releases" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"dsh ${VERSION} Windows 开箱即用包(tar.xz,系统 tar 解压) | sha256 ${SHA256} | ${BUILT_AT}\",\"target_commitish\":\"master\"}")
          RELEASE_ID=$(echo "$RELEASE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).id))")
          echo "Gitee Release ID: $RELEASE_ID"
          UPLOADED=0
          for attempt in 1 2; do
            HTTP=$(curl -sS -o /tmp/attach-resp.txt -w '%{http_code}' --connect-timeout 20 --max-time 600 \
              -X POST "https://gitee.com/api/v5/repos/zhang-jixiangZJX/dsh-dist/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@${ARCHIVE}")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then UPLOADED=1; break; fi
            echo "第 ${attempt} 次上传失败(HTTP ${HTTP}):$(head -c 200 /tmp/attach-resp.txt)"
            [ "$attempt" -lt 2 ] && sleep 10
          done
          if [ "$UPLOADED" != "1" ]; then
            echo "Gitee 附件上传最终失败"; cat /tmp/attach-resp.txt; exit 1
          fi
          echo "Gitee 附件上传完成"

          # 双端覆写 latest.json(指针最后移动)
          write_latest() { # $1=目录
            cd "$1"
            cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "built_at": "${BUILT_AT}",
            "bundle": {
              "win_x64": {
                "gitee_url": "${GITEE_URL}",
                "github_url": "${GITHUB_URL}",
                "size": ${SIZE},
                "sha256": "${SHA256}"
              }
            }
          }
          EOF
            git config user.name "dist-bot"
            git config user.email "dist-bot@users.noreply.github.com"
            git add latest.json
            git commit -qm "chore: bundle latest -> v${VERSION}"
            git push -q origin master
            cd - >/dev/null
          }
          write_latest /tmp/dist-gitee
          write_latest /tmp/dist-gh

          echo "完成: $TAG"
          echo "  国内: $GITEE_URL"
          echo "  海外: $GITHUB_URL"
